name: "Audio Ads Studio"
version: "1.2.1"
slug: "audio_ads"
description: "Crea spot pubblicitari con voce AI, musica, effetti e mastering."
url: "https://github.com/EdisonACDC/audio-ads"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:radio-tower"
panel_title: "Audio Ads"
panel_admin: false
options:
  default_language: "de-DE"
  default_gender: "female"
  default_mastering: "sonos"
schema:
  default_language: str
  default_gender: list(female|male)
  default_mastering: list(streaming|broadcast|sonos)
